name: SynthOBS verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine, figures, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
      - run: uv sync --extra dev
      - run: uv run python scripts/generate_figures.py
      - run: uv run python -m pytest tests --cov=synthobs --cov-fail-under=90
      - run: uv build
      - run: uv run python scripts/package_smoke.py

  native-parser:
    name: Native parser behavioral parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
      - run: uv sync --extra dev
      - run: uv run python -m pytest tests/test_c_parity_behavioral.py -q


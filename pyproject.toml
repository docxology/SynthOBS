# SynthOBS / FractiSynth v1.618 — project configuration
# The tested Python engine that the native FractiSynth C plugin and the obspython
# SynthOBS console script both mirror. Inherits workspace settings from root.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthobs"
version = "1.618.0"
description = "Golden-ratio OBS broadcast console (SynthOBS) + native transducer (FractiSynth), driven by fail-closed live solar telemetry"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
requires-python = ">=3.10"
# The importable engine (src/synthobs) is stdlib-only by design — that is the whole
# "tested engine is the single source of truth" claim. numpy/matplotlib are needed
# only by the figure/analysis scripts (the `figures` extra), and pyyaml was unused.
dependencies = []

[project.optional-dependencies]
# Figure generation + the analysis/verifier scripts (thin orchestrators, not the engine).
figures = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.0.0",
    "websocket-client>=1.8.0",
    "synthobs[figures]",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["synthobs"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
